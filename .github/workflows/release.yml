name: Release check

# Releases are cut locally with ./package.sh, not here, and this workflow checks the
# result rather than producing it.
#
# That is a deliberate reversal of the obvious design. A runner has no signing identity,
# so anything it built would be ad-hoc signed -- and the auto-updater refuses a build
# whose signature does not match the running app's. A CI-built release would therefore be
# offered to every existing install and then declined by all of them, which is a worse
# failure than not automating it: it looks like the updater is broken.
#
# So: build and publish with `./package.sh` on a machine that has the identity, then this
# checks the three things that are easy to get wrong by hand.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Run on a tag push it checks that tag. Run by hand from a branch there is no tag
      # to check, so it falls back to VERSION -- which makes the interesting half below
      # (are the artifacts there, does SHA256SUMS match) runnable on demand.
      - name: Work out which release to check
        id: which
        run: |
          FILE="$(tr -d '[:space:]' < VERSION)"
          case "$GITHUB_REF_NAME" in
            v*)
              if [ "${GITHUB_REF_NAME#v}" != "$FILE" ]; then
                echo "::error::tag $GITHUB_REF_NAME does not match VERSION ($FILE)"
                exit 1
              fi
              TAG="$GITHUB_REF_NAME"
              echo "tag and VERSION agree on $FILE"
              ;;
            *)
              TAG="v$FILE"
              echo "not a tag ($GITHUB_REF_NAME); checking the release for VERSION: $TAG"
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$FILE" >> "$GITHUB_OUTPUT"

      - name: The Rust crate agrees too
        run: |
          FILE="$(tr -d '[:space:]' < VERSION)"
          WIN="$(sed -n 's/^version = "\(.*\)"/\1/p' win/Cargo.toml | head -1)"
          if [ "$WIN" != "$FILE" ]; then
            echo "::error::win/Cargo.toml says $WIN but VERSION says $FILE"
            echo "The Windows updater compares against its own baked version, so a stale"
            echo "one here makes the .exe offer itself an update forever."
            exit 1
          fi
          echo "win/Cargo.toml agrees on $WIN"

      - name: The release has every artifact, and SHA256SUMS actually matches them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.which.outputs.tag }}"
          V="${{ steps.which.outputs.version }}"
          mkdir -p verify && cd verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" || {
            echo "::error::no release published for $TAG yet -- cut it with ./package.sh"
            exit 1
          }
          for f in "IsaacCompanion-$V.dmg" "IsaacCompanion-$V.pkg" "IsaacCompanion-$V.zip" \
                   "IsaacCompanion-$V-windows-x64.exe" "IsaacCompanion-$V-windows-x64.zip" \
                   SHA256SUMS; do
            [ -f "$f" ] || { echo "::error::$TAG is missing $f"; exit 1; }
          done
          # The whole update mechanism rests on this file being right. A stale manifest
          # would make every client refuse a perfectly good build.
          sha256sum --check --ignore-missing SHA256SUMS
          echo "all artifacts present and every checksum matches"
